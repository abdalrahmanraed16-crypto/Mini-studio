<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Studio</title>
<style>
  :root {
    --bg: #1a1a1a; --panel: #252526; --panel-2: #2d2d30;
    --border: #3e3e42; --text: #cccccc; --text-dim: #858585;
    --accent: #007acc; --play: #16a34a; --stop: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; }

  #app {
    display: grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 40px 1fr 24px;
    grid-template-areas:
      "toolbar toolbar toolbar"
      "explorer viewport inspector"
      "status  status   status";
    height: 100vh;
  }
  #toolbar  { grid-area: toolbar; display: flex; align-items: center;
              gap: 6px; padding: 0 10px; background: var(--panel);
              border-bottom: 1px solid var(--border); flex-wrap: wrap;
              overflow-x: auto; }
  #explorer { grid-area: explorer; background: var(--panel);
              border-right: 1px solid var(--border); overflow-y: auto;
              transition: opacity 0.15s; }
  #viewport { grid-area: viewport; position: relative; background: #202020; }
  #inspector{ grid-area: inspector; background: var(--panel);
              border-left: 1px solid var(--border); overflow-y: auto;
              transition: opacity 0.15s; }
  #status   { grid-area: status; background: var(--panel-2);
              border-top: 1px solid var(--border); padding: 0 10px;
              display: flex; align-items: center; font-size: 11px;
              color: var(--text-dim); gap: 12px; }

  body.playing #explorer, body.playing #inspector {
    opacity: 0.35; pointer-events: none;
  }
  body.playing .tool-btn[data-tool] { opacity: 0.4; pointer-events: none; }
  body.playing #hint { display: none; }
  #play-hint { display: none; position: absolute; bottom: 10px; left: 10px;
    background: rgba(22,163,74,0.85); padding: 6px 12px; border-radius: 4px;
    font-size: 11px; color: #fff; pointer-events: none; line-height: 1.5;
    z-index: 10; }
  body.playing #play-hint { display: block; }
  #play-hint b { color: #fff; }

  canvas { display: block; width: 100%; height: 100%; }

  #gui-layer {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden; z-index: 5;
  }
  .gui-textlabel {
    position: absolute; display: flex; align-items: center;
    justify-content: center; padding: 4px 6px; box-sizing: border-box;
    user-select: none; white-space: pre-wrap; word-break: break-word;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.15; text-align: center;
    pointer-events: auto; cursor: move; transition: outline 0.08s;
  }
  .gui-textlabel.selected { outline: 2px dashed #00a2ff; outline-offset: 1px; }
  body.playing .gui-textlabel { pointer-events: none; cursor: default; }
  body.playing .gui-textlabel.selected { outline: none; }

  .gui-imagelabel, .gui-videolabel {
    position: absolute; display: flex; align-items: center;
    justify-content: center; box-sizing: border-box;
    user-select: none; pointer-events: auto; cursor: move;
    overflow: hidden; transition: outline 0.08s;
  }
  .gui-imagelabel.selected, .gui-videolabel.selected {
    outline: 2px dashed #00a2ff; outline-offset: 1px;
  }
  body.playing .gui-imagelabel,
  body.playing .gui-videolabel { pointer-events: none; cursor: default; }
  body.playing .gui-imagelabel.selected,
  body.playing .gui-videolabel.selected { outline: none; }
  .gui-imagelabel > img,
  .gui-videolabel > video {
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; display: block;
  }
  .gui-placeholder {
    color: #888; font-size: 12px; font-style: italic;
    padding: 4px; text-align: center;
  }

  .tool-btn {
    background: transparent; color: var(--text); border: 1px solid transparent;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    white-space: nowrap;
  }
  .tool-btn:hover { background: var(--panel-2); }
  .tool-btn.active { background: var(--accent); color: #fff; }
  .tool-btn.danger:hover { background: #a12622; }
  .tool-btn.play { color: #7ee787; }
  .tool-btn.play:hover:not(:disabled) { background: rgba(22,163,74,0.2); }
  .tool-btn.stop { color: #ff7b72; }
  .tool-btn.stop:hover:not(:disabled) { background: rgba(220,38,38,0.2); }
  .tool-btn.save { color: #8ec9ff; }
  .tool-btn.save:hover { background: rgba(0,122,204,0.2); }
  .tool-btn.load { color: #f0c674; }
  .tool-btn.load:hover { background: rgba(240,198,116,0.15); }
  .tool-btn.gui { color: #c39bff; }
  .tool-btn.gui:hover { background: rgba(160,108,213,0.25); }
  .tool-btn:disabled { opacity: 0.3; cursor: default; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  .panel-title {
    padding: 8px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .tree { padding: 4px 0; font-size: 12px; }
  .tree-item {
    display: flex; align-items: center;
    padding: 3px 8px 3px 0; cursor: pointer; user-select: none;
    white-space: nowrap; min-height: 20px;
  }
  .tree-item:hover { background: var(--panel-2); }
  .tree-item.selected { background: var(--accent); color: #fff; }
  .tree-arrow { width: 14px; font-size: 9px; text-align: center;
    color: var(--text-dim); flex-shrink: 0; }
  .tree-item.selected .tree-arrow { color: #fff; }
  .tree-icon {
    width: 12px; height: 12px; border-radius: 2px;
    margin: 0 6px 0 2px; flex-shrink: 0;
    background: #a0a0a0; border: 1px solid rgba(0,0,0,0.3);
  }
  .tree-icon.workspace        { background: #e5b800; }
  .tree-icon.lighting         { background: #f5cd30; }
  .tree-icon.baseplate        { background: #4a4a4a; }
  .tree-icon.part             { background: #00a2ff; }
  .tree-icon.sphere           { border-radius: 50%; background: #e74c3c; }
  .tree-icon.cylinder         { border-radius: 2px; background: #2ecc71; }
  .tree-icon.spawn            { border-radius: 50%; background: #4d4d4d;
                                box-shadow: inset 0 0 0 2px #f0f0f0; }
  .tree-icon.starterplayer    { background: #00a2ff; }
  .tree-icon.folder           { background: #7a7a7a; }
  .tree-icon.startergui       { background: #a06cd5; }
  .tree-icon.textlabel        { background: #c39bff; }
  .tree-icon.imagelabel       { background: #ff9f43; }
  .tree-icon.videolabel       { background: #ee5a24; }
  .tree-icon.starterpack      { background: #a06cd5; }
  .tree-icon.replicatedstorage{ background: #a06cd5; }
  .tree-icon.serverstorage    { background: #a06cd5; }
  .tree-icon.serverscriptservice { background: #a06cd5; }
  .tree-icon.soundservice     { background: #ff7b72; }
  .tree-icon.players          { background: #2ecc71; }
  .tree-icon.teams            { background: #2ecc71; }
  .tree-label { overflow: hidden; text-overflow: ellipsis; }

  .field { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .field label { display: block; font-size: 11px; color: var(--text-dim);
                 margin-bottom: 4px; }
  .field input[type="text"], .field input[type="number"] {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 3px;
    font-family: inherit; font-size: 12px;
  }
  .field textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 3px;
    font-family: inherit; font-size: 12px; resize: vertical; min-height: 50px;
  }
  .field input:focus, .field textarea:focus {
    outline: 1px solid var(--accent); border-color: var(--accent);
  }
  .field select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 4px 6px; border-radius: 3px;
    font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .field select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .field input[type="range"] { accent-color: var(--accent); height: 4px; cursor: pointer; }
  .field input[type="file"] { color: var(--text); font-size: 11px; cursor: pointer; }
  .row { display: flex; gap: 4px; }
  .row input { flex: 1; min-width: 0; }
  .empty { padding: 20px 12px; color: var(--text-dim);
           text-align: center; font-style: italic; }

  .section-header {
    padding: 8px 12px 4px 12px;
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-dim);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    margin-top: 2px;
  }

  .add-btn {
    display: block; width: calc(100% - 24px); margin: 10px 12px;
    background: #5a2fa0; color: #fff;
    border: 1px solid #7a4fc0; border-radius: 4px;
    padding: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .add-btn:hover { background: #6a3fb0; }

  #viewport.placing { cursor: crosshair; }
  body.dragging { cursor: grabbing; }

  #hint { position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.55); padding: 6px 10px;
    border-radius: 4px; font-size: 11px; color: #bbb;
    pointer-events: none; line-height: 1.5; z-index: 10; }
  #hint b { color: #fff; }

  #toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(22,163,74,0.95); color: #fff;
    padding: 8px 16px; border-radius: 4px;
    font-size: 12px; font-weight: 600;
    pointer-events: none; opacity: 0;
    transition: opacity 0.25s; z-index: 100;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: rgba(220,38,38,0.95); }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="explorer">
    <div class="panel-title">Explorer</div>
    <div class="tree" id="tree"></div>
  </div>
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="gui-layer"></div>
    <div id="hint">
      <b>LMB drag part</b> move &nbsp;·&nbsp; <b>RMB</b> rotate &nbsp;·&nbsp;
      <b>MMB</b> pan &nbsp;·&nbsp; <b>Scroll</b> zoom<br>
      <b>WASD</b> fly &nbsp;·&nbsp; <b>Q/E</b> down/up &nbsp;·&nbsp; <b>Shift</b> sprint
    </div>
    <div id="play-hint">
      <b>WASD</b> walk &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp;
      <b>RMB</b> look &nbsp;·&nbsp; <b>I/O</b> zoom &nbsp;·&nbsp; <b>Esc</b> stop
    </div>
    <div id="toast"></div>
  </div>
  <div id="inspector">
    <div class="panel-title">Properties</div>
    <div id="props"></div>
  </div>
  <div id="status">
    <span id="status-text">Ready</span>
    <span id="status-play" style="color:#7ee787; display:none;">● PLAYING</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   EventBus
   ============================================================ */
class EventBus {
  constructor() { this.map = new Map(); }
  on(evt, fn) {
    if (!this.map.has(evt)) this.map.set(evt, new Set());
    this.map.get(evt).add(fn);
    return () => this.map.get(evt).delete(fn);
  }
  emit(evt, payload) {
    if (this.map.has(evt)) for (const fn of this.map.get(evt)) fn(payload);
  }
}

/* ============================================================
   HierNode + buildDefaultGame
   ============================================================ */
class HierNode {
  constructor(name, type) {
    this.name = name; this.type = type;
    this.children = []; this.parent = null;
    this.expanded = true;
    this.object3D = null; this.service = null; this.guiElement = null;
  }
  add(child) { child.parent = this; this.children.push(child); return child; }
  remove(child) {
    const i = this.children.indexOf(child);
    if (i >= 0) this.children.splice(i, 1);
    child.parent = null;
  }
}

function buildDefaultGame() {
  const root = new HierNode('Game', 'game');
  const workspace = new HierNode('Workspace', 'workspace');
  workspace.add(new HierNode('Baseplate', 'baseplate'));
  workspace.add(new HierNode('Camera', 'folder'));
  const players = new HierNode('Players', 'players');
  const lighting = new HierNode('Lighting', 'lighting');
  lighting.add(new HierNode('Sun', 'folder'));
  lighting.add(new HierNode('Ambient', 'folder'));
  const starterPlayer = new HierNode('StarterPlayer', 'starterplayer');
  starterPlayer.add(new HierNode('StarterPlayerScripts', 'folder'));
  starterPlayer.add(new HierNode('StarterCharacterScripts', 'folder'));
  const starterGui          = new HierNode('StarterGui', 'startergui');
  const starterPack         = new HierNode('StarterPack', 'starterpack');
  const replicatedStorage   = new HierNode('ReplicatedStorage', 'replicatedstorage');
  const serverScriptService = new HierNode('ServerScriptService', 'serverscriptservice');
  const serverStorage       = new HierNode('ServerStorage', 'serverstorage');
  const soundService        = new HierNode('SoundService', 'soundservice');
  const teams               = new HierNode('Teams', 'teams');
  root.add(workspace); root.add(players); root.add(lighting);
  root.add(starterPlayer); root.add(starterGui); root.add(starterPack);
  root.add(replicatedStorage); root.add(serverScriptService);
  root.add(serverStorage); root.add(soundService); root.add(teams);
  return { root, workspace, lighting, starterPlayer, players, starterGui };
}

/* ============================================================
   Services
   ============================================================ */
class StarterPlayerService {
  constructor() {
    this.isService = true;
    this.serviceType = 'StarterPlayer';
    this.name = 'StarterPlayer';
    this.cameraZoomable  = true;
    this.lockFirstPerson = false;
  }
}
class PlayersService {
  constructor() {
    this.isService = true;
    this.serviceType = 'Players';
    this.name = 'Players';
    this._respawnTime = 3;
  }
  get respawnTime() { return this._respawnTime; }
  set respawnTime(v) {
    const n = Number(v);
    this._respawnTime = (isFinite(n) && n >= 0) ? n : 0;
  }
}

/* ============================================================
   GUI element classes
   ============================================================ */
class TextLabel {
  constructor(opts = {}) {
    this.isGuiElement = true;
    this.type = 'TextLabel';
    this.name = opts.name || 'TextLabel';
    this.text = opts.text ?? 'Text';
    this.x = (opts.x ?? 0.35);
    this.y = (opts.y ?? 0.40);
    this.w = (opts.w ?? 0.30);
    this.h = (opts.h ?? 0.10);
    this.textColor       = opts.textColor ?? '#ffffff';
    this.backgroundColor = opts.backgroundColor ?? '#000000';
    this.backgroundTransparency = (opts.backgroundTransparency ?? 0.5);
    this.fontSize = (opts.fontSize ?? 28);
    this.visible = opts.visible !== false;
    this.hierNode = null;
  }
}
class ImageLabel {
  constructor(opts = {}) {
    this.isGuiElement = true;
    this.type = 'ImageLabel';
    this.name = opts.name || 'ImageLabel';
    this.x = (opts.x ?? 0.30);
    this.y = (opts.y ?? 0.25);
    this.w = (opts.w ?? 0.40);
    this.h = (opts.h ?? 0.50);
    this.backgroundColor        = opts.backgroundColor ?? '#000000';
    this.backgroundTransparency = (opts.backgroundTransparency ?? 1);
    this.imageTransparency      = (opts.imageTransparency ?? 0);
    this.src = opts.src || null;
    this.fileName = opts.fileName || null;
    this.visible = opts.visible !== false;
    this.hierNode = null;
  }
}
class VideoLabel {
  constructor(opts = {}) {
    this.isGuiElement = true;
    this.type = 'VideoLabel';
    this.name = opts.name || 'VideoLabel';
    this.x = (opts.x ?? 0.20);
    this.y = (opts.y ?? 0.20);
    this.w = (opts.w ?? 0.60);
    this.h = (opts.h ?? 0.60);
    this.backgroundColor        = opts.backgroundColor ?? '#000000';
    this.backgroundTransparency = (opts.backgroundTransparency ?? 1);
    this.videoTransparency      = (opts.videoTransparency ?? 0);
    this.looped   = opts.looped !== false;
    this.muted    = opts.muted !== false;
    this.controls = opts.controls === true;
    this.autoplay = opts.autoplay !== false;
    this.src = opts.src || null;
    this.fileName = opts.fileName || null;
    this.visible = opts.visible !== false;
    this.hierNode = null;
  }
}

class StarterGuiService {
  constructor(hierarchyNode) {
    this.isService = true;
    this.serviceType = 'StarterGui';
    this.name = 'StarterGui';
    this.hierarchyNode = hierarchyNode;
    this.elements = [];
  }
  uniqueName(base) {
    const ctors = { TextLabel, ImageLabel, VideoLabel };
    const Ctor = ctors[base];
    const same = this.elements.filter(e => Ctor && e instanceof Ctor).length;
    return same === 0 ? base : base + (same + 1);
  }
  addElement(el) { this.elements.push(el); return el; }
  removeElement(el) {
    const i = this.elements.indexOf(el);
    if (i >= 0) this.elements.splice(i, 1);
  }
}

/* ============================================================
   Helpers
   ============================================================ */
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}
function clamp01(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hexToRgba(hex, transparency) {
  const h = String(hex || '#000000').replace('#', '');
  const r = parseInt(h.slice(0, 2), 16) || 0;
  const g = parseInt(h.slice(2, 4), 16) || 0;
  const b = parseInt(h.slice(4, 6), 16) || 0;
  const a = 1 - Math.max(0, Math.min(1, Number(transparency) || 0));
  return `rgba(${r},${g},${b},${a})`;
}

/* ============================================================
   GUIRenderer
   ============================================================ */
class GUIRenderer {
  constructor(layerEl, editor) {
    this.layer = layerEl;
    this.editor = editor;
    this.nodeByEl = new Map();
  }
  sync() {
    const sg = this.editor.starterGui;
    if (!sg) return;

    for (const [el, node] of [...this.nodeByEl]) {
      if (!sg.elements.includes(el)) {
        node.remove();
        this.nodeByEl.delete(el);
      }
    }

    for (const el of sg.elements) {
      let node = this.nodeByEl.get(el);
      if (!node) {
        node = document.createElement('div');
        if (el.type === 'TextLabel')       node.className = 'gui-textlabel';
        else if (el.type === 'ImageLabel') node.className = 'gui-imagelabel';
        else                               node.className = 'gui-videolabel';
        this.layer.appendChild(node);
        this.nodeByEl.set(el, node);
        this._attachHandlers(el, node);
      }
      this._applyStyles(el, node);
      this._applyContent(el, node);
    }
  }

  _applyStyles(el, node) {
    node.style.left   = (el.x * 100) + '%';
    node.style.top    = (el.y * 100) + '%';
    node.style.width  = (el.w * 100) + '%';
    node.style.height = (el.h * 100) + '%';
    node.style.background = hexToRgba(el.backgroundColor, el.backgroundTransparency);
    node.style.display = el.visible ? 'flex' : 'none';
    node.classList.toggle('selected', this.editor.selection.current === el);
  }

  _applyContent(el, node) {
    if (el.type === 'TextLabel') {
      node.textContent = el.text;
      node.style.color = el.textColor;
      node.style.fontSize = el.fontSize + 'px';
      node.style.lineHeight = '1.15';
      node.style.textAlign = 'center';
      node.style.whiteSpace = 'pre-wrap';
      node.style.wordBreak = 'break-word';
      node.style.fontFamily = '-apple-system, "Segoe UI", Roboto, sans-serif';
    } else if (el.type === 'ImageLabel') {
      let img = node.querySelector('img');
      let ph  = node.querySelector('.gui-placeholder');
      if (el.src) {
        if (!img) {
          if (ph) ph.remove();
          img = document.createElement('img');
          img.draggable = false;
          node.appendChild(img);
        }
        if (img.src !== el.src) img.src = el.src;
        img.style.opacity = String(1 - clamp01(el.imageTransparency, 0, 1));
      } else {
        if (img) { img.remove(); img = null; }
        if (!ph) {
          ph = document.createElement('div');
          ph.className = 'gui-placeholder';
          ph.textContent = 'Right-side Properties → Image to upload';
          node.appendChild(ph);
        }
      }
    } else if (el.type === 'VideoLabel') {
      let vid = node.querySelector('video');
      let ph  = node.querySelector('.gui-placeholder');
      if (el.src) {
        if (!vid) {
          if (ph) ph.remove();
          vid = document.createElement('video');
          vid.playsInline = true;
          vid.preload = 'metadata';
          node.appendChild(vid);
        }
        if (vid.src !== el.src) { vid.src = el.src; vid.load(); }
        vid.loop = !!el.looped;
        vid.muted = !!el.muted;
        vid.controls = !!el.controls;
        vid.style.opacity = String(1 - clamp01(el.videoTransparency, 0, 1));
        if (el.autoplay) {
          const p = vid.play();
          if (p && p.catch) p.catch(() => {});
        } else {
          vid.pause();
        }
      } else {
        if (vid) { vid.pause(); vid.remove(); vid = null; }
        if (!ph) {
          ph = document.createElement('div');
          ph.className = 'gui-placeholder';
          ph.textContent = 'Right-side Properties → Video to upload';
          node.appendChild(ph);
        }
      }
    }
  }

  _attachHandlers(el, node) {
    node.addEventListener('pointerdown', (e) => {
      if (this.editor.playMode) return;
      if (e.button !== 0) return;
      e.stopPropagation();
      e.preventDefault();
      this.editor.selection.select(el);

      const rect = this.layer.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY;
      const startElX = el.x, startElY = el.y;

      const onMove = (ev) => {
        const dx = (ev.clientX - startX) / rect.width;
        const dy = (ev.clientY - startY) / rect.height;
        el.x = clamp01(startElX + dx, 0, 1 - el.w);
        el.y = clamp01(startElY + dy, 0, 1 - el.h);
        this._applyStyles(el, node);
        this.editor.bus.emit('gui:moved', el);
      };
      const onUp = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
}

function makeSunTexture() {
  const size = 256, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size/2, cy = size/2;

  glow.addColorStop(0,'rgba(255,255,200,1)');
  glow.addColorStop(0.25,'rgba(255,225,120,0.85)');
  glow.addColorStop(0.55,'rgba(255,185,70,0.35)');
  glow.addColorStop(1,'rgba(255,150,30,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,size,size);
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, size*0.22);
  core.addColorStop(0,'#ffffff');
  core.addColorStop(0.6,'#fff8b8');
  core.addColorStop(1,'rgba(255,240,150,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.22, 0, Math.PI*2); ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
function makeMoonTexture() {
  const size = 256, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size/2, cy = size/2;
  const glow = ctx.createRadialGradient(cx, cy, size*0.22, cx, cy, size*0.5);
  glow.addColorStop(0,'rgba(220,220,235,0.45)');
  glow.addColorStop(1,'rgba(180,180,200,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,size,size);
  const disc = ctx.createRadialGradient(cx-20,cy-20,5,cx,cy,size*0.28);
  disc.addColorStop(0,'#f5f5fa'); disc.addColorStop(0.7,'#d8d8e4');
  disc.addColorStop(1,'#a8a8b8');
  ctx.fillStyle = disc;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.28, 0, Math.PI*2); ctx.fill();
  const craters = [[-30,-25,16],[22,-15,10],[5,30,20],[-15,20,8],[30,18,6],[-25,5,5]];
  for (const [dx, dy, r] of craters) {
    const g = ctx.createRadialGradient(cx+dx-r*0.3,cy+dy-r*0.3,0,cx+dx,cy+dy,r);
    g.addColorStop(0,'rgba(150,150,170,0.55)');
    g.addColorStop(1,'rgba(180,180,200,0.15)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx+dx, cy+dy, r, 0, Math.PI*2); ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return tex;
}
function makeSpawnTopTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;
  ctx.fillStyle = '#4d4d4d';
  ctx.fillRect(0, 0, size, size);
  const vig = ctx.createRadialGradient(cx, cy, size * 0.1, cx, cy, size * 0.5);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = size * 0.03;
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.46, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = size * 0.022;
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.40, 0, Math.PI * 2); ctx.stroke();
  const R_OUT = size * 0.36, R_IN = size * 0.07;
  ctx.fillStyle = '#f0f0f0';
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const r = (i % 2 === 0) ? R_OUT : R_IN;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4d4d4d';
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.055, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = size * 0.012;
  ctx.beginPath(); ctx.arc(cx, cy, size * 0.055, 0, Math.PI * 2); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
function makeNoobFaceTexture() {
  const size = 256, c = document.createElement('canvas');

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.ellipse(size*0.34, size*0.38, size*0.055, size*0.075, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(size*0.66, size*0.38, size*0.055, size*0.075, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = size*0.05;

/* ============================================================
   LightingService
   ============================================================ */
class LightingService {
  constructor(scene, hemi, dir) {
    this.isService = true;
    this.serviceType = 'Lighting';
    this.name = 'Lighting';
    this.scene = scene; this.hemi = hemi; this.dir = dir;
    this._clockTime = 14;
    this._sunFile = null; this._moonFile = null;
    this._sunSpriteDist = 500;
    this.sunTexture = makeSunTexture();
    this.sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.sunTexture, transparent: true, depthWrite: false, fog: false }));
    this.sunSprite.scale.set(120, 120, 1);
    this.sunSprite.renderOrder = -1;
    scene.add(this.sunSprite);
    this.moonTexture = makeMoonTexture();
    this.moonSprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.moonTexture, transparent: true, depthWrite: false, fog: false }));
    this.moonSprite.scale.set(90, 90, 1);
    this.moonSprite.renderOrder = -1;
    scene.add(this.moonSprite);
    this._apply();
  }
  get clockTime() { return this._clockTime; }
  set clockTime(v) { this._clockTime = Math.max(0, Math.min(24, v)); this._apply(); }
  get sunFile() { return this._sunFile; }
  get moonFile() { return this._moonFile; }
  setSunImage(file) {
    this._sunFile = file;
    if (!file) { this.sunSprite.material.map = this.sunTexture;
      this.sunSprite.material.needsUpdate = true; return; }
    const url = URL.createObjectURL(file);
    new THREE.TextureLoader().load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      this.sunSprite.material.map = tex;
      this.sunSprite.material.needsUpdate = true;
      URL.revokeObjectURL(url);
    });
  }
  setMoonImage(file) {
    this._moonFile = file;
    if (!file) { this.moonSprite.material.map = this.moonTexture;
      this.moonSprite.material.needsUpdate = true; return; }
    const url = URL.createObjectURL(file);
    new THREE.TextureLoader().load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      this.moonSprite.material.map = tex;
      this.moonSprite.material.needsUpdate = true;
      URL.revokeObjectURL(url);
    });
  }
  _apply() {
    const t = this._clockTime;
    const angle = ((t - 6) / 24) * Math.PI * 2;
    const dist = 60;
    this.dir.position.set(Math.cos(angle)*dist, Math.sin(angle)*dist, 20);
    const D = this._sunSpriteDist;
    const len = this.dir.position.length() || 1;
    const k = D / len;
    this.sunSprite.position.copy(this.dir.position).multiplyScalar(k);
    this.moonSprite.position.copy(this.dir.position).multiplyScalar(-k);
    const sunHeight = Math.sin(angle);
    const day = Math.max(0, sunHeight);
    this.dir.intensity = 0.15 + day * 1.5;
    this.hemi.intensity = 0.12 + day * 0.9;
    const sky = new THREE.Color();
    if (sunHeight > 0.2) sky.setHex(0x87ceeb);
    else if (sunHeight > -0.2) {
      const f = (sunHeight + 0.2) / 0.4;
      sky.lerpColors(new THREE.Color(0xff8a4a), new THREE.Color(0x87ceeb), f);
    } else sky.setHex(0x080c18);
    this.scene.background.copy(sky);
    if (sunHeight > 0.2) this.dir.color.setHex(0xffffff);
    else if (sunHeight > -0.2) this.dir.color.setHex(0xffb480);
    else this.dir.color.setHex(0x5566aa);
    this.sunSprite.material.opacity  = Math.max(0, Math.min(1, (sunHeight + 0.15) / 0.35));
    this.moonSprite.material.opacity = Math.max(0, Math.min(1, (-sunHeight + 0.15) / 0.35));
  }
}

   CameraRig
   ============================================================ */
class CameraRig {
  constructor(renderer, canvas, viewport, bus) {
    this.bus = bus; this.canvas = canvas;
    this.viewport = viewport; this.renderer = renderer;
    this.camera = new THREE.PerspectiveCamera(60, 1, 0.1, 4000);
    this.camera.position.set(18, 14, 18);
    this.camera.rotation.order = 'YXZ';
    this.controls = new OrbitControls(this.camera, canvas);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.12;
    this.controls.screenSpacePanning = true;
    this.controls.mouseButtons = {
      LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE
    };
    this.controls.target.set(0, 0, 0);
    this.controls.minDistance = 1;
    this.controls.maxDistance = 500;
    this._firstPerson = false;
    this._fpActive = false;
    this._fpLast = { x: 0, y: 0 };
    this._yaw = 0;
    this._pitch = 0;
    this._cameraDistance = 10;
    this._zoomMin = 4;
    this._zoomMax = 30;
    this.keys = new Set();
    this._baseSpeed = 20; this._sprintMult = 3;
    this._bindKeys();
    this._bindFirstPersonLook();
    addEventListener('resize', () => this.resize());
    this.resize();
  }
  _bindKeys() {
    const isTyping = (e) => e.target && (e.target.tagName === 'INPUT' ||
      e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
    addEventListener('keydown', (e) => {
      if (isTyping(e)) return;
      if (e.code === 'Space') e.preventDefault();
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
  }
  _bindFirstPersonLook() {
    this.canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 2 || !this._firstPerson) return;
      this._fpActive = true;
      this._fpLast = { x: e.clientX, y: e.clientY };
      this.canvas.setPointerCapture(e.pointerId);
    });
    this.canvas.addEventListener('pointermove', (e) => {
      if (!this._fpActive) return;
      const dx = e.clientX - this._fpLast.x;
      const dy = e.clientY - this._fpLast.y;
      this._fpLast = { x: e.clientX, y: e.clientY };
      this._yaw   -= dx * 0.005;
      this._pitch -= dy * 0.005;
      const lim = Math.PI / 2 - 0.05;
      if (this._pitch >  lim) this._pitch =  lim;
      if (this._pitch < -lim) this._pitch = -lim;
    });
    this.canvas.addEventListener('pointerup', (e) => {
      if (e.button === 2) {
        this._fpActive = false;
        try { this.canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    });
  }
  setFirstPerson(on) {
    this._firstPerson = on;
    this.controls.enabled = !on;
    if (on) { this._yaw = 0; this._pitch = 0; }
  }
  zoomIn()  { this._cameraDistance = Math.max(this._zoomMin, this._cameraDistance - 1.5); }
  zoomOut() { this._cameraDistance = Math.min(this._zoomMax, this._cameraDistance + 1.5); }
  update(dt) {
    const k = this.keys;
    if (k.size === 0) return;
    const sprint = k.has('ShiftLeft') || k.has('ShiftRight');
    const speed = this._baseSpeed * (sprint ? this._sprintMult : 1);
    const forward = new THREE.Vector3();
    this.camera.getWorldDirection(forward);
    const right = new THREE.Vector3()
      .crossVectors(forward, this.camera.up).normalize();
    const move = new THREE.Vector3();
    if (k.has('KeyW')) move.add(forward);
    if (k.has('KeyS')) move.sub(forward);
    if (k.has('KeyD')) move.add(right);
    if (k.has('KeyA')) move.sub(right);
    if (k.has('KeyE')) move.y += 1;
    if (k.has('KeyQ')) move.y -= 1;
    if (move.lengthSq() === 0) return;
    move.normalize().multiplyScalar(speed * dt);
    this.camera.position.add(move);
    this.controls.target.add(move);
  }
  resize() {
    const w = this.viewport.clientWidth || 1;
    const h = this.viewport.clientHeight || 1;
    this.renderer.setSize(w, h, false);
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }
}

/* ============================================================
   SelectionManager
   ============================================================ */
class SelectionManager {
  constructor(scene, bus) {
    this.scene = scene; this.bus = bus;
    this.current = null; this.outline = null;
    this.outlineMat = new THREE.LineBasicMaterial({ color: 0x00a2ff });
  }
  select(target) {
    if (target === this.current) return;
    this.current = target;
    this._refreshOutline();
    this.bus.emit('selection:changed', target);
  }
  deselect() { this.select(null); }
  refresh() { this._refreshOutline(); }
  setVisible(v) { if (this.outline) this.outline.visible = v; }
  _refreshOutline() {
    if (this.outline) {
      this.scene.remove(this.outline);
      this.outline.geometry.dispose();
      this.outline = null;
    }
    const obj = this.current;
    if (!obj || !obj.geometry) return;
    const edges = new THREE.EdgesGeometry(obj.geometry, 30);
    this.outline = new THREE.LineSegments(edges, this.outlineMat);
    this.outline.userData.follow = obj;
    this.syncOutline();
    this.scene.add(this.outline);
  }
  syncOutline() {
    const o = this.outline; if (!o || !o.userData.follow) return;
    const t = o.userData.follow;
    o.position.copy(t.position);
    o.rotation.copy(t.rotation);
    o.scale.copy(t.scale);
  }
}

/* ============================================================
   OofSynth
   ============================================================ */
class OofSynth {
  constructor() { this.ctx = null; }
  _ensureContext() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  }
  play() {
    const ctx = this._ensureContext();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const dur = 0.28;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.9, t0 + 0.012);
    master.gain.setValueAtTime(0.9, t0 + 0.06);
    master.gain.exponentialRampToValueAtTime(0.35, t0 + 0.20);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    master.connect(ctx.destination);
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass'; lowpass.Q.value = 1.2;
    lowpass.frequency.setValueAtTime(1600, t0);
    lowpass.frequency.exponentialRampToValueAtTime(500, t0 + dur);
    lowpass.connect(master);
    const formant = ctx.createBiquadFilter();
    formant.type = 'bandpass'; formant.Q.value = 1.8;
    formant.frequency.setValueAtTime(520, t0);
    formant.frequency.exponentialRampToValueAtTime(360, t0 + dur);
    formant.connect(lowpass);
    const osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(165, t0);
    osc1.frequency.exponentialRampToValueAtTime(85, t0 + dur);
    const g1 = ctx.createGain(); g1.gain.value = 0.55;
    osc1.connect(g1).connect(formant);
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(158, t0);
    osc2.frequency.exponentialRampToValueAtTime(82, t0 + dur);
    const g2 = ctx.createGain(); g2.gain.value = 0.55;
    osc2.connect(g2).connect(formant);
    const noiseLen = Math.floor(ctx.sampleRate * 0.04);
    const noiseBuf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseLen; i++) nd[i] = (Math.random()*2-1)*(1-i/noiseLen);
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.25, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 400; noiseFilter.Q.value = 1;
    noiseSrc.connect(noiseFilter).connect(noiseGain).connect(master);
    osc1.start(t0); osc1.stop(t0 + dur);
    osc2.start(t0); osc2.stop(t0 + dur);
    noiseSrc.start(t0); noiseSrc.stop(t0 + 0.05);
  }
}

      new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.7 }),

    ];
    const head = new THREE.Mesh(headGeo, headMats);
    head.castShadow = true; head.receiveShadow = true;
    head.position.set(0, 4.75, 0);

    const makeLimb = (color) => {
